

# -------------------------
# General / bookkeeping
# -------------------------

general:
    save_name: ""
    resume_epoch: 0

# -------------------------
# Data loading
# -------------------------

data:
    variables: ["tas", "pr", "sfcWind", "rsds"]
    variables_lr: ["tas", "pr", "sfcWind", "rsds", "psl"]
    n_models: 1 # TO DO: unclear how to handle
    run_indices: [0, 1, 2, 3, 4, 5, 6, 7]
    kernel_size_lr: 1
    kernel_size_hr: 1
    precip_zeros: "random"
    data_dir: "/r/scratch/groups/nm/downscaling/cordex-ALPS-allyear"

@dataclass
class DataPreprocessing:
    norm_method_input: null
    norm_method_output: null
    logit_transform: False
    normal_transform: False
    sqrt_transform_out: False
    sqrt_transform_in: False

# -------------------------
# Model architecture
# -------------------------

@dataclass
class ModelConfig:
    method: "eng_unet"
    conv: False
    nicolai_layers: True
    conv_dim: 16
    hidden_dim: 1000
    layer_shrinkage: 16
    noise_dim: 100
    dropout: False
    noise_std: 1.0
    out_act: null
    num_layer: 6
    preproc_layer: True
    preproc_dim: 20
    one_hot_in_super: True
    one_hot_only_in_ups: True

# -------------------------
# Losses / constraints
# -------------------------

@dataclass
class LossConfig:
    beta: 1.0
    calc_raw_loss: False

# -------------------------
# Location-specific layers
# -------------------------

@dataclass
class SparseLocalLayerConfig:
    num_neighbors_res: 25
    num_neighbors_ups: 9
    mlp_depth: 3
    not_split_residuals: True

# -------------------------
# Training
# -------------------------

@dataclass
class TrainingConfig:
    batch_size: int = 512
    num_epochs: 500
    lr: 1e-4
    weight_decay: 0.0
    alpha: 1.0
    burn_in: 0
general:
  save_name: "_v2_train_example"
  server: "ada"
  save_dir_root_local: "results"
  save_dir_root_server: "/cluster/work/math/climate-downscaling/cordex-data/cordex-ALPS-allyear/eng-results"

data:
  type: cordex_ensemble
  variables: ["tas", "pr", "sfcWind", "rsds"]
  variables_lr: ["pr"]
  kernel_size_lr: 16
  kernel_size_hr: 8
  return_timepair: false
  random_state: 42
  data_dir: "/r/scratch/groups/nm/downscaling/cordex-ALPS-allyear"

  cordex:
    root: "/r/scratch/groups/nm/downscaling/cordex-ALPS-allyear"
    lr_pattern: "{root}/{folder}/{var}_day_{gcm}_{variant}_rcp85_EUROPE_g025{file_suffix}{var_suffix}.nc"
    hr_pattern: "{root}/{folder}/{var}_day_EUR-11_{rcm}_{gcm}_{variant}_rcp85_ALPS_cordexgrid{file_suffix}{var_suffix}.nc"

  train:
    folder_lr: "train"
    folder_hr: "train_norm_unif"
    file_suffix: "_train-period"

  validation:
    folder: "valid"
    file_suffix: ""

  runs:
    selection: first_n
    n_models: 1

  ensemble_encoding:
    enabled: true
    scheme: rcm

  # Variable-specific suffixes can be used for pre-normalized files or any custom naming.
  hr_var_suffix_by_var:
    pr: "_subsample-v2"
    tas: "_subsample-v2"
    sfcWind: "_subsample-v2"
    rsds: "_subsample-v2"

  preprocessing:
    norm_method_input: "normalise_scalar"
    norm_method_output: "uniform"
    fft: false
    normal_transform: true
    logit_transform: false
    clip_quantile: null
    flip_latitude: true
    sep_mean_std: false
    use_pre_normalized_lr: false
    use_pre_normalized_hr: true
    sqrt_transform_in:
      pr: false
      sfcWind: false
    sqrt_transform_out:
      pr: false
      sfcWind: false
    stats:
      root: "/r/scratch/groups/nm/downscaling/cordex-ALPS-allyear/norm_stats"
      pattern:
        primitive: null
        normalise_pw: "{mode}_norm_stats_pixelwise_{var}_train_ALL{suffix}.pt"
        normalise_scalar: "{mode}_norm_stats_full-data_{var}_train_ALL{suffix}.pt"
        uniform: "{mode}_norm_stats_ecdf_matrix_{var}_train_SUBSAMPLE{suffix}.pt"
    post_transform:
      logit: false
      gaussian: true

model:
  method: "eng_2step"
  conv: false
  nicolai_layers: true
  conv_concat: false
  conv_dim: 16
  hidden_dim: 12
  layer_shrinkage: 16
  noise_dim: 100
  dropout: false
  noise_std: 1.0
  out_act: null
  num_layer: 6
  preproc_layer: false
  preproc_dim: 20
  mlp: true
  bn: false
  one_hot_in_super: true
  one_hot_only_in_ups: true
  add_x_in_super: false
  split_coarse_model: false

loss:
  avg_constraint: false
  max_loss: false
  norm_loss: false
  norm_loss_loc: false
  lambda_norm_loss_loc: 1.0
  norm_loss_batch: false
  agg_norm_loss: "mean"
  norm_loss_per_var: false
  p_norm_loss_loc: null
  p_norm_loss_batch: null
  lambda_coarse: 0.5
  beta: 1.0
  beta_norm_loss: 1.0
  patched_loss: false
  patch_size: 8
  calc_raw_loss: false

sparse_layers:
  num_neighbors_res: 25
  num_neighbors_ups: 9
  latent_dim: 12
  mlp_depth: 2
  noise_dim_mlp: 0
  double_linear: false
  add_intermediate_loss: false
  add_mse_loss: false
  lambda_mse_loss: 0
  not_split_residuals: true

training:
  batch_size: 512
  num_epochs: 500
  lr: 1e-4
  weight_decay: 1e-3
  alpha: 1.0
  burn_in: 0
  save_model_every: 50
  num_workers: 0




# -------------------------
# General / bookkeeping
# -------------------------

general:
    save_name: "_normal_preproc_zerosconstant_TEST2"
    resume_epoch: 0

# -------------------------
# Data loading
# -------------------------

data:
    variables: ["tas", "pr", "sfcWind", "rsds"]
    variables_lr: ["tas", "pr", "sfcWind", "rsds", "psl"]
    n_models: 8
    run_indices: [0]
    kernel_size_lr: 16
    kernel_size_hr: 1
    precip_zeros: "constant"
    data_dir: "/r/scratch/groups/nm/downscaling/cordex-ALPS-allyear"

preprocessing:
    norm_method_input: "normalise_scalar"
    norm_method_output: "uniform"
    logit_transform: False
    normal_transform: True
    sqrt_transform_out: False
    sqrt_transform_in: False
    sep_mean_std: False
    fft: False

# -------------------------
# Model architecture
# -------------------------

model:
    method: "eng_2step"
    conv: False
    nicolai_layers: False
    conv_concat: False
    conv_dim: 16
    hidden_dim: 200
    layer_shrinkage: 1
    noise_dim: 10
    dropout: False
    noise_std: 1.0
    out_act: null
    num_layer: 6
    preproc_layer: True
    preproc_dim: 50
    mlp: True
    bn: False
    one_hot_in_super: False
    one_hot_only_in_ups: False
    add_x_in_super: False
    split_coarse_model: False

# -------------------------
# Losses / constraints
# -------------------------

loss:
    avg_constraint: False
    max_loss: False
    norm_loss: True
    norm_loss_loc: True
    lambda_norm_loss_loc: 1.0
    norm_loss_batch: True
    agg_norm_loss: "mean"
    norm_loss_per_var: False
    p_norm_loss_loc: [4]
    p_norm_loss_batch: [4]
    lambda_coarse: 0.5
    beta: 1.0
    beta_norm_loss: 1.0
    patched_loss: False
    patch_size: 8
    calc_raw_loss: False

# -------------------------
# Location-specific layers
# -------------------------

sparse_layers:
    num_neighbors_res: 25
    num_neighbors_ups: 9
    latent_dim: 12
    mlp_depth: 3
    noise_dim_mlp: 0
    double_linear: False
    add_intermediate_loss: False
    add_mse_loss: False
    lambda_mse_loss: 1.0
    not_split_residuals: False

# -------------------------
# Training
# -------------------------

training:
    batch_size: 512
    num_epochs: 500
    lr: 1e-4
    weight_decay: 1e-3
    alpha: 1.0
    burn_in: 0
    save_model_every: 50